name: Secret Scan

# Pflicht-Check fuer Pull Requests: scannt nur die Commits des PR (Diffs), nicht den Altbestand.
# Regeln: .gitleaks.toml (Standardregeln + wpa-psk). Fund = roter Check = Merge gesperrt
# (Branch-Protection: Status-Check "Secret Scan / gitleaks" erforderlich).

on:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks installieren (gepinnt, Pruefsumme)
        run: |
          V=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks

      - name: Scan der PR-Commits
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          /tmp/gitleaks git . -c .gitleaks.toml --no-banner --redact -v \
            --log-opts="origin/${{ github.base_ref }}..HEAD"
